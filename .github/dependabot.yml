version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime-minor:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Major upgrades (e.g. TypeScript 7, jsdom 30, @vitejs/plugin-react 6,
      # @testing-library/jest-dom 7) change behaviour or APIs and are done in
      # deliberate, reviewed PRs rather than automatic bumps.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # v6+ requires pnpm 11; the project is pinned to pnpm 10.28.0.
      - dependency-name: pnpm/action-setup
        versions: ['>=6']
